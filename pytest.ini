[pytest]
asyncio_mode = auto
testpaths = deepeval-tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    llm: LLM-judged deepeval evaluation tests (require OPENROUTER_API_KEY); skipped automatically when the key is absent.
    efficiency: offline token/cost efficiency tests, deterministic, no API key required.